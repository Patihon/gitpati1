<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติของนายปฏิภาณ</title>
  <style>
    :root {
      --pink: #ff4fa3;
      --pink-light: #ffabd2;
      --black: #09090b;
      --muted: #d7c8d0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff;
      font-family: "Segoe UI", "Leelawadee UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 79, 163, 0.22), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(255, 79, 163, 0.12), transparent 25%),
        var(--black);
    }

    main {
      width: min(760px, 100%);
      overflow: hidden;
      border: 1px solid rgba(255, 171, 210, 0.45);
      border-radius: 28px;
      background: rgba(18, 18, 22, 0.92);
      box-shadow:
        0 24px 70px rgba(255, 79, 163, 0.16),
        inset 0 1px rgba(255, 255, 255, 0.05);
    }

    .header {
      padding: 38px 36px 30px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 79, 163, 0.25);
      background: linear-gradient(135deg, rgba(255, 79, 163, 0.18), transparent);
    }

    .avatar {
      display: grid;
      width: 144px;
      height: 144px;
      margin: 0 auto 18px;
      overflow: hidden;
      place-items: center;
      border: 3px solid var(--pink-light);
      border-radius: 50%;
      color: var(--pink-light);
      background: rgba(255, 79, 163, 0.1);
      box-shadow: 0 0 28px rgba(255, 79, 163, 0.2);
    }

    .avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-placeholder {
      padding: 12px;
      font-size: 0.95rem;
    }

    h1 {
      margin: 0;
      color: var(--pink-light);
      font-size: clamp(2rem, 8vw, 3.6rem);
      line-height: 1.1;
      letter-spacing: 1px;
      text-shadow: 0 0 24px rgba(255, 79, 163, 0.35);
    }

    .photo-picker {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 18px;
      border: 1px solid rgba(255, 171, 210, 0.55);
      border-radius: 999px;
      color: #fff;
      font-weight: 600;
      background: rgba(255, 79, 163, 0.16);
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease;
    }

    .photo-picker:hover {
      transform: translateY(-2px);
      background: rgba(255, 79, 163, 0.3);
    }

    .photo-picker:focus-within {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .photo-picker input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    .details {
      display: grid;
      gap: 14px;
      padding: 28px 32px 32px;
    }

    .detail {
      margin: 0;
      padding: 18px 20px;
      border: 1px solid rgba(255, 79, 163, 0.16);
      border-radius: 16px;
      color: #f7edf2;
      font-size: clamp(1.05rem, 3vw, 1.25rem);
      font-weight: 600;
      background: linear-gradient(90deg, rgba(255, 79, 163, 0.11), rgba(255, 255, 255, 0.025));
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .detail:hover {
      transform: translateX(6px);
      border-color: var(--pink);
    }

    .detail::before {
      content: "";
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 12px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 12px var(--pink);
      vertical-align: middle;
    }

    .section-title {
      margin: 8px 0 0;
      color: var(--pink-light);
      font-size: 1.35rem;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .skills li {
      padding: 9px 14px;
      border: 1px solid rgba(255, 79, 163, 0.35);
      border-radius: 999px;
      color: #ffe6f1;
      background: rgba(255, 79, 163, 0.1);
    }

    .skills-summary {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .header {
        padding: 32px 20px 24px;
      }

      .details {
        padding: 18px;
      }

      .avatar {
        width: 124px;
        height: 124px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <div class="avatar" id="avatar">
        <span class="avatar-placeholder">เพิ่มรูปโปรไฟล์</span>
      </div>
      <h1>ประวัติของนายปฏิภาณ</h1>
      <label class="photo-picker">
        <span id="photo-label">เลือกรูปภาพ</span>
        <input id="photo-input" type="file" accept="image/*" aria-label="เลือกรูปโปรไฟล์">
      </label>
    </div>
    <div class="details">
      <h2 class="detail">อายุ 20 ปี</h2>
      <h2 class="detail">ชอบแมว ชอบฟังเพลง และชอบเล่นเกม</h2>
      <h2 class="detail">เกิดวันที่ 1 สิงหาคม 2549</h2>
      <h2 class="section-title">ทักษะและความสามารถ</h2>
      <p class="skills-summary">เก่งทุกอย่าง พร้อมเรียนรู้และลงมือทำได้หลากหลาย</p>
      <ul class="skills">
        <li>เรียนรู้ไว</li>
        <li>แก้ปัญหา</li>
        <li>ทำงานเป็นทีม</li>
        <li>สื่อสาร</li>
        <li>เล่นเกม</li>
        <li>ฟังเพลง</li>
      </ul>
    </div>
  </main>
  <script>
    const photoInput = document.getElementById("photo-input");
    const avatar = document.getElementById("avatar");
    const photoLabel = document.getElementById("photo-label");
    let photoUrl;

    photoInput.addEventListener("change", () => {
      const photo = photoInput.files[0];
      if (!photo) return;

      if (photoUrl) URL.revokeObjectURL(photoUrl);
      photoUrl = URL.createObjectURL(photo);

      const image = document.createElement("img");
      image.src = photoUrl;
      image.alt = "รูปโปรไฟล์ของนายปฏิภาณ";
      avatar.replaceChildren(image);
      photoLabel.textContent = "เปลี่ยนรูปภาพ";
    });
  </script>
</body>
</html>
